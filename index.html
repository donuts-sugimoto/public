<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sugimoto-public</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f7fa;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      color: #1e2d4e;
      padding: 48px 24px;
    }
    h1 { font-size: 28px; margin-bottom: 32px; }
    ul { list-style: none; display: flex; flex-wrap: wrap; gap: 16px; }
    li a {
      display: block;
      padding: 16px 32px;
      background: #fff;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      color: #1e2d4e;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      transition: box-shadow .12s;
    }
    li a:hover { box-shadow: 0 4px 20px rgba(0,0,0,.18); }
  </style>
</head>
<body>
  <h1>Works</h1>
  <ul>
    <li><a href="game/hiyoko/">🐣 ひよこ飛距離チャレンジ</a></li>
  </ul>
</body>
</html>
